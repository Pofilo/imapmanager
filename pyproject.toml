[project]
name = "imapmanager"
# Still 0.0.1-dev because lazy to keep this line updated over time
version = "0.0.1-dev"  # REQUIRED, although can be dynamic
description = "Connect and manage your mail account through IMAP."
readme = "README.md"
requires-python = "==3.14.6"
license = {file = "LICENSE"}
keywords = ["imap", "python"]

authors = [
    {name = "pofilo", email = "git@pofilo.fr"},
]
maintainers = [
    {name = "pofilo", email = "git@pofilo.fr"},
]

classifiers = [
    "4 - Beta",
    "Programming Language :: Python"
]

dependencies = [
    "PyYAML==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
# $ pip install .[linters]
linters = [
    "ruff==0.16.0",
]
# $ pip install .[tests]
tests = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[project.urls]
Repository = "https://git.pofilo.fr/pofilo/imapmanager"
"Bug Tracker" = "https://git.pofilo.fr/pofilo/imapmanager/issues"
Changelog = "https://git.pofilo.fr/pofilo/imapmanager/graph"

[project.scripts]
imapmanager = "imapmanager:main"
list-folders = "imapmanager.scripts.list_folders:main"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
# https://docs.astral.sh/ruff/rules/
ignore = [
    "D105",  # undocumented-magic-method
    "D107",  # undocumented-public-init
    "D200",  # fits-on-one-line
    "D203",  # one-blank-line-before-class
    "D205",  # blank-line-after-summary
    "D212",  # multi-line-summary-first-line
    "FIX002",  # line-contains-todo
    # Disagree with those rules
    "UP015",  # redundant-open-modes
    "TRY400",  # error-instead-of-exception
    # False positives
    "ERA001",  # commented-out-code
    "CPY001",  # missing-copyright-notice
    # "The following rules may cause conflicts when used with the formatter"
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",  # type annotations are noise in tests
    "D",  # no docstring requirement for tests
    "S101",  # assert allowed in tests
    "S105",  # hardcoded fake passwords in fixtures
    "S106",  # hardcoded fake passwords in fixtures
    "SLF001",  # tests access private members
    "PLR2004",  # magic values in assertions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ so tests always run against the working tree,
# not a stale copy that may be installed in site-packages.
pythonpath = ["src"]

[tool.coverage.run]
source = ["imapmanager"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.typos]

[tool.typos.default.extend-words]
# "Caf=E9" (-> "Café") in unit test
Caf = "Caf"
