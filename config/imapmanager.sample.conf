#########################
#        GENERAL        #
#########################
[GENERAL]
IMAP_HOSTNAME = imap.domain.com
# Default port for SSL is 993
IMAP_PORT = 993
IMAP_USERNAME = example@domain.fr
IMAP_PASSWORD = azerty
# The IMAP folder where imapmanager will process unread mails.
IMAP_MAILBOX = INBOX
# Polling interval in seconds (aka the time between the end of a cycle and the start of the next one)
# For example if the process takes 3 seconds, the next one will be
# 13 seconds after the start of it.
POLLING_INTERVAL = 10
# If a mail has no rule (no subject nor from nor to rules),
# it will be moved in this one.
DEFAULT_FOLDER = INBOX.others
# FATAL, ERROR, WARN, INFO, DEBUG
LOG_LEVEL = INFO

#########################
#        FILTERS        #
#########################
# Filters are divided in 3 categories.
# First, the 'subject' will be analyzed, then the 'from' and the 'to' field.
# Each category is working in the same way:
#   - the key represents the filter
#   - the value represents the folder where the mail needs to be moved
# A mail will be moved if the content of the key (between quotes) is part of the field of the mail.
#

[SUBJECT]
"[SPAM]" = INBOX.spamFolder
"*** SPAM ***" = INBOX.spamFolder

[FROM]
"mail1@domain.com" = INBOX.folder1

[TO]
"mail1@domain1.com" = INBOX.folder1
"mail2@domain1.com" = INBOX.folder2

