#########################
#        GENERAL        #
#########################
hostname: imap.domain.com
# Default port for SSL is 993
port: 993
username: example@domain.fr
password: azerty
# The IMAP folder where imapmanager will process unread mails.
mailbox: INBOX
# Polling interval in seconds (aka the time between the end of a cycle and the start of the next one)
# For example if the process takes 3 seconds, the next one will be
# 13 seconds after the start of it.
pollingInterval: 10
# If a mail has no rule (no subject nor from nor to rules),
# it will be moved in this one.
defaultFolder: INBOX.others
# FATAL, ERROR, WARN, INFO, DEBUG
logLevel: INFO
# Default weight. Any filter can override this value (optional: default value is 0)
# weight: 0

#########################
#        FILTERS        #
#########################
# Filters are divided in 4 categories, evaluated in this order:
#   'subject', then 'body', then 'from', and finally the 'to'/'cc' fields
#   (both represented by the 'dest' category).
# Each category works the same way:
#   - the key is the destination folder name;
#   - its value is the list of filters to analyse.
# Each filter is composed of:
#   - pattern: the text to look for (matched case-insensitively as a substring
#     of the mail field, e.g. pattern "spam" matches a subject "This is SPAM!");
#   - actions: a list among [move, mark_as_read, telegram];
#   - weight: an optional integer priority (defaults to the top-level 'weight',
#     itself 0 if unset).
#
# EXACTLY-ONE-RULE SEMANTICS (important):
# A mail may match several filters, but only ONE rule is ever applied: the single
# matching filter with the highest weight wins, and ONLY its actions are performed.
# Ties (equal weight) are broken by evaluation order (subject > body > from > to > cc,
# then the order filters are listed within a category).
# Actions from the other matching filters are NOT merged. For example, if a mail
# matches a 'from' rule with weight 100 and actions [move] AND a 'subject' rule with
# actions [telegram, mark_as_read], only the 'from' rule wins: the mail is moved but
# NO telegram notification is sent and it is NOT marked as read.
# If a rule wins but has no 'move' action, the mail is moved to the defaultFolder.
#

filters:
  subject:
    INBOX.spamFolder:
      - pattern: "[SPAM]"
        actions: [move, mark_as_read]
      - pattern: "*** SPAM ***"
        actions: [move, mark_as_read]
      # Also works with UTF-8
      - pattern: "Сοոոесt аոⅾ Ꮯⅼаіⅿ"
        actions: [move, mark_as_read]

  body:
    INBOX.spamFolder:
      - pattern: "You won 1000 bictoins"
        actions: [move, mark_as_read]

  from:
    INBOX.folder1:
      - pattern: "mail1@domain.com"
        actions: [move]
        weight: 100

  dest:
    INBOX.folder1:
      - pattern: "mail1@domain1.com"
        actions: [move]
    INBOX.example folder with spaces:
      - pattern: "mail2@domain1.com"
        actions: [move]
      # - pattern: "mail2@domain2.com"
      #   actions: [move, telegram]

