#########################
#        GENERAL        #
#########################
hostname: imap.domain.com
# Default port for SSL is 993
port: 993
username: example@domain.fr
password: azerty
# The IMAP folder where imapmanager will process unread mails.
mailbox: INBOX
# Polling interval in seconds (aka the time between the end of a cycle and the start of the next one)
# For example if the process takes 3 seconds, the next one will be
# 13 seconds after the start of it.
pollingInterval: 10
# If a mail has no rule (no subject nor from nor to rules),
# it will be moved in this one.
defaultFolder: INBOX.others
# FATAL, ERROR, WARN, INFO, DEBUG
logLevel: INFO
# Default weight. Any filter can override this value (optional: default value is 0)
# weight: 0

#########################
#        FILTERS        #
#########################
# Filters are divided in 3 categories.
# First, the 'subject' will be analyzed, then the 'body', and finally the 'from'
# and the 'to'/'cc' fields (represented by the 'DEST' category).
# Each category is working in the same way:
#   - the key represents the folden name
#   - the values represent the filters to analyse
# Each filter is composed of the key (what to analyse) and a list of actions.
# A mail will be moved if the one filter (between quotes) is part of the field of the mail.
#

filters:
  subject:
    INBOX.spamFolder:
      - pattern: "[SPAM]"
        actions: [move, mark_as_read]
      - pattern: "*** SPAM ***"
        actions: [move, mark_as_read]
      # Also works with UTF-8
      - pattern: "Сοոոесt аոⅾ Ꮯⅼаіⅿ"
        actions: [move, mark_as_read]

  body:
    INBOX.spamFolder:
      - pattern: "You won 1000 bictoins"
        actions: [move, mark_as_read]

  from:
    INBOX.folder1:
      - pattern: "mail1@domain.com"
        actions: [move]
        weight: 100

  dest:
    INBOX.folder1:
      - pattern: "mail1@domain1.com"
        actions: [move]
    INBOX.example folder with spaces:
      - pattern: "mail2@domain1.com"
        actions: [move]
      # - pattern: "mail2@domain2.com"
      #   actions: [move, telegram]

